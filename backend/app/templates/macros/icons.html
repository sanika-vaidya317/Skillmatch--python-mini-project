{% macro icon(name, size=18) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == "sparkles" %}
  <path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="M5 3v4M3 5h4M19 14v5M16.5 16.5h5"/>
  {% elif name == "chevron-right" %}
  <path d="m9 18 6-6-6-6"/>
  {% elif name == "layout-dashboard" %}
  <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
  {% elif name == "bar-chart-3" %}
  <path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/>
  {% elif name == "graduation-cap" %}
  <path d="m22 10-10-5L2 10l10 5 10-5Z"/><path d="M6 12v5c3.3 2.7 8.7 2.7 12 0v-5M22 10v6"/>
  {% elif name == "users" %}
  <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 8v6M23 11h-6"/>
  {% elif name == "user-cog" %}
  <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM19.4 15.4l.6.6-.6.6.3.8h-.9l-.4.8-.6-.6-.8.3v-.9l-.8-.4.6-.6-.3-.8h.9l.4-.8.6.6.8-.3v.9Z"/>
  {% elif name == "log-out" %}
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
  {% elif name == "check" %}
  <path d="m5 12 4 4L19 6"/>
  {% elif name == "x" %}
  <path d="M18 6 6 18M6 6l12 12"/>
  {% endif %}
</svg>
{%- endmacro %}
